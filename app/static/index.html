<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loop Engine Debate</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <p class="brand">Loop Engine</p>
        <h1>Live debate</h1>
        <p class="lede">
          Writer drafts. Critic pushes back. You watch both sides as each turn lands.
        </p>
        <form id="start-form">
          <label for="problem">Your problem</label>
          <textarea id="problem" rows="6" required placeholder="Describe the problem…"></textarea>
          <label for="max-rounds">Starting rounds</label>
          <select id="max-rounds">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="10">10</option>
          </select>
          <p class="hint-inline">Continue always adds 3 more rounds.</p>
          <div class="btn-row">
            <button type="submit" id="run-btn">Start debate</button>
            <button type="button" id="stop-btn" class="ghost" disabled>Stop</button>
          </div>
          <button type="button" id="continue-btn" class="ghost continue" disabled>
            Continue 3 more rounds
          </button>
        </form>
        <p id="status-line" class="status">Waiting to start</p>
        <p id="round-pill" class="pill">No round yet</p>
        <div id="score-trend" class="score-trend"></div>

        <div class="history-block">
          <div class="history-head">
            <h3>Past sessions</h3>
            <button type="button" id="refresh-sessions" class="linkish">Refresh</button>
          </div>
          <ul id="session-list" class="session-list"></ul>
        </div>
      </aside>

      <main class="stage">
        <section class="lane writer-lane">
          <header>
            <span class="dot writer-dot"></span>
            <div>
              <h2>Writer</h2>
              <p>Proposes and revises the solution</p>
            </div>
          </header>
          <div id="writer-col" class="messages"></div>
        </section>
        <section class="lane critic-lane">
          <header>
            <span class="dot critic-dot"></span>
            <div>
              <h2>Critic</h2>
              <p>Stress-tests every claim</p>
            </div>
          </header>
          <div id="critic-col" class="messages"></div>
        </section>
        <section id="final" class="verdict hidden"></section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
